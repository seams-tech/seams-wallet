<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Seams external wallet acceptance</title>
  </head>
  <body>
    <h1>External wallet acceptance · NEAR testnet</h1>
    <p id="availability">Loading connector…</p>
    <button id="detect" type="button">Refresh wallet detection</button>
    <button id="meteor" type="button">Connect Meteor</button>
    <button id="intear" type="button">Connect Intear</button>
    <button id="disconnect" type="button">Disconnect</button>
    <p>
      The transaction calls set_greeting on seams-v1.testnet with zero attached deposit and 10 Tgas.
    </p>
    <button id="greeting" type="button">Send testnet greeting</button>
    <button id="check" type="button">Check transaction status</button>
    <pre id="result" role="status"></pre>
    <script type="module" src="./external-wallet-acceptance.js"></script>
  </body>
