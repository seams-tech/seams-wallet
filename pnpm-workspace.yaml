packages:
  - apps/docs
  - crates/router-ab-cloudflare
  - examples/seams-auth-menu
  - examples/wallet-console-lite
  - packages/checkout
  - packages/cli
  - packages/frame-kit
  - packages/host
  - packages/shared-ts
  - packages/mpc-wallet-server
  - packages/mpc-wallet
  - packages/voiceid
  - packages/wallet-connect
  - tests
  - tests/intended-app
nodeLinker: hoisted
saveExact: true
verifyDepsBeforeRun: false
allowBuilds:
  bufferutil: true
  esbuild: true
  protobufjs: false
  sharp: true
  utf-8-validate: true
  workerd: true
minimumReleaseAgeExclude:
  - '@seams/sayso-verdict@0.2.0'
  - '@seams/voice-capture@0.72.0'
  - '@seams/voice-sign@0.72.0'
  - '@seams/voice-verdict@0.72.0'
