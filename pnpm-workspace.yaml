packages:
  - apps/docs
  - crates/router-ab-cloudflare
  - examples/seams-auth-menu
  - examples/wallet-console-lite
  - packages/seams-cli
  - packages/shared-ts
  - packages/wallet-server
  - packages/wallet
  - packages/voiceid
  - tests
  - tests/intended-app
nodeLinker: hoisted
saveExact: true
verifyDepsBeforeRun: false
allowBuilds:
  bufferutil: true
  esbuild: true
  protobufjs: false
  sharp: true
  utf-8-validate: true
  workerd: true
minimumReleaseAgeExclude:
  - '@seams/voice-capture@0.70.2'
  - '@seams/voice-sign@0.70.2'
  - '@seams/voice-verdict@0.70.2'
