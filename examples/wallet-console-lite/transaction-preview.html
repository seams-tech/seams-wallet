<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seams · Transaction component preview</title>
    <style>
      html {
        overflow: hidden;
      }
      #theme {
        display: none;
      }
      .seams-wallet-ui .seams-drawer-body {
        overflow: clip;
      }
      body {
        margin: 0;
        background: #eef1ee;
        color: #21372d;
        font: 14px system-ui;
      }
      header {
        padding: 20px;
        background: #f8faf7;
        border-bottom: 1px solid #d9dfda;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        line-height: 1.6;
      }
      nav {
        display: grid;
        gap: 16px;
      }
      .control-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .control-label {
        width: 100%;
        font-size: 12px;
        font-weight: 650;
        color: #59645d;
      }
      nav button {
        min-height: 44px;
        padding: 9px 14px;
        border: 1px solid #c5cec8;
        border-radius: 8px;
        background: white;
        color: inherit;
        cursor: pointer;
      }
      nav button:hover {
        background: #eaf1e8;
      }
      nav button:focus-visible {
        outline: 2px solid #24593f;
        outline-offset: 2px;
      }
      #status {
        margin-bottom: 0;
        font-size: 12px;
        color: #59645d;
      }
      nav button[data-example]::before,
      nav button[data-stage]::before {
        content: '✓';
        display: inline-block;
        width: 1em;
        margin-inline-end: 6px;
        visibility: hidden;
      }
      nav button[aria-pressed='true'] {
        background: #24593f;
        border-color: #24593f;
        color: white;
      }
      nav button[aria-pressed='true']::before {
        visibility: visible;
      }
      main {
        width: min(420px, calc(100vw - 32px));
        margin: 24px auto;
      }
      main .seams-confirmation-modal {
        overflow: visible;
      }
      main .seams-confirmation-modal .modal-container-root {
        align-items: start;
        box-shadow:
          0 0 0 1px #172e1d10,
          0 12px 24px -12px #0b221b22,
          0 32px 70px -28px #0b221b38;
      }
      main:has([data-receipt-view='toast']) {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: min(360px, calc(100vw - 48px));
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <nav aria-label="Preview controls">
        <div class="control-group" role="group" aria-label="Transaction type">
          <span class="control-label">Transaction type</span>
          <button data-example="transfer">ETH transfer</button>
          <button data-example="evm">EVM function call</button>
          <button data-example="near">NEAR function call</button>
        </div>
        <div class="control-group" role="group" aria-label="Transaction stage">
          <span class="control-label">Jump to a stage</span>
          <button data-stage="review">Review</button>
          <button data-stage="signing">Signing</button>
          <button data-stage="signed">Signed · ⅓</button>
          <button data-stage="broadcasting">Broadcasting</button>
          <button data-stage="submitted">Broadcast accepted · ⅔</button>
          <button data-stage="confirmed">Confirmed · full</button>
          <button data-stage="failed">Failed</button>
        </div>
        <div class="control-group" role="group" aria-label="Preview actions">
          <button id="minimize">Minimize</button>
          <button id="theme">Toggle theme</button>
        </div>
      </nav>
      <p id="status" role="status">Review</p>
    </header>
    <main></main>
    <script type="module" src="/src/transaction-preview.ts"></script>
  </body>
</html>
