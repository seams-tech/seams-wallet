[package]
name = "ml-dsa-investigation"
version = "0.1.0"
edition = "2024"
description = "Host-only ML-DSA-65 investigation with public synthetic fixtures"
license = "Apache-2.0"
publish = false

[dependencies]
ml-dsa-threshold = { path = "../../crates/ml-dsa-threshold", features = ["benchmarks"] }
router-ab-cloudflare = { path = "../../crates/router-ab-cloudflare", features = ["ml-dsa"] }
router-ab-core = { path = "../../crates/router-ab-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
wallet_custody_ceremony = { path = "../../wasm/wallet_custody_ceremony" }
base64ct = { version = "1.6", features = ["alloc"] }
hpke-ng = "0.1.0"
signer-core = { path = "../../crates/signer-core", features = ["ml-dsa-custody"] }
ml-dsa = "=0.1.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sha3 = "=0.10.9"
keccak = "=0.1.6"
hex = "=0.4.3"
tempfile = "=3.27.0"
ed25519-yao-generator = { path = "../ed25519-yao-generator" }
zeroize = "=1.9.0"
getrandom = { version = "=0.2.17", features = ["std"] }
aws-lc-rs = "=1.18.1"
borsh = "1.3"
bs58 = "0.5"
wasm_signer_worker = { path = "../../wasm/near_signer", features = ["ml-dsa"] }
wasmparser = { version = "=0.214.0", default-features = false, features = ["std"] }
