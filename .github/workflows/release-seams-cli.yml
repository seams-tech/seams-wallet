name: Release seams CLI

# Recovery artifacts are only as trustworthy as the binary that reads them, so
# a release is built from a selected main-branch revision, checksummed, signed with the
# CI-held release root, verified by the binary it ships, and only then
# published. The pinned trust compiled into the binary is checked first: a
# release pinned to the repository's test keys would trust everything the test
# suite can forge.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: The release version to publish, for example 0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  SEAMS_RELEASE_VERSION: ${{ inputs.release_version }}
  SEAMS_TARGETS: aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu

jobs:
  trust:
    if: github.ref == 'refs/heads/main'
    environment: release-signing
    name: Check the pinned trust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate the release version
        run: |
          set -euo pipefail
          if [[ ! "$SEAMS_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'release_version must be a numeric major.minor.patch version with an optional prerelease suffix' >&2
            exit 1
          fi

      - name: Refuse a binary pinned to the repository's test keys
        run: |
          set -euo pipefail
          # These are the keys the committed fixtures are signed with. Both
          # pinned files are replaced by the production root ceremonies before
          # the first release; a binary that still carries them must not ship.
          if grep -q 'buCR_SgKm2hVT6c8WIEl1H00JcaKJroja02tkPkKj5I' \
              crates/seams-cli/trust/recovery-trust-bundle.json; then
            echo 'refusing to release: the pinned recovery trust bundle is the test fixture' >&2
            exit 1
          fi
          if grep -q 'JfwyxHilpPhORVegNC4IJ4yINkG2FJvbC0qYarbCy3g' \
              crates/seams-cli/trust/release-root.json; then
            echo 'refusing to release: the pinned release root is the test key' >&2
            exit 1
          fi

      - name: Require the signer to be the pinned release root
        env:
          SEAMS_RELEASE_SIGNER_KEY_ID: ${{ secrets.SEAMS_RELEASE_SIGNER_KEY_ID }}
        run: |
          set -euo pipefail
          pinned="$(jq -r .keyId crates/seams-cli/trust/release-root.json)"
          if [ -z "$SEAMS_RELEASE_SIGNER_KEY_ID" ] || [ "$pinned" != "$SEAMS_RELEASE_SIGNER_KEY_ID" ]; then
            echo "refusing to release: the signer key id is not the pinned release root ($pinned)" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: trust
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build the recovery binary
        run: |
          cargo build --locked --release \
            --manifest-path crates/seams-cli/Cargo.toml \
            --bin seams-wallet --target ${{ matrix.target }}

      - name: Name the artifact for its target
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "crates/seams-cli/target/${{ matrix.target }}/release/seams-wallet" \
            "dist/seams-wallet-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: seams-wallet-${{ matrix.target }}
          path: dist/seams-wallet-${{ matrix.target }}
          if-no-files-found: error

  manifest:
    environment: release-signing
    name: Sign the checksum manifest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Record the software bill of materials
        run: |
          set -euo pipefail
          # The exact dependency set this binary was built from, so a reviewer
          # can see what the recovery tool links without rebuilding it.
          cargo tree --locked --manifest-path crates/seams-cli/Cargo.toml \
            --edges normal --prefix depth > dist/seams-sbom.txt

      - name: Build the signing tool before exposing the key
        run: cargo build --locked --release --manifest-path crates/seams-cli/Cargo.toml --bin seams-release-manifest

      - name: Sign the release checksum manifest
        env:
          SEAMS_RELEASE_SIGNING_KEY: ${{ secrets.SEAMS_RELEASE_SIGNING_KEY }}
          SEAMS_RELEASE_SIGNER_KEY_ID: ${{ secrets.SEAMS_RELEASE_SIGNER_KEY_ID }}
        run: |
          set -euo pipefail
          # The signing key reaches the generator on a dedicated descriptor,
          # never on the command line, so it cannot appear in a process listing
          # or a build log. The SBOM is signed with the binaries: an unsigned
          # dependency list could be swapped without the manifest noticing.
          umask 077
          signing_key_file="$(mktemp)"
          trap 'rm -f "$signing_key_file"' EXIT
          printf '%s' "$SEAMS_RELEASE_SIGNING_KEY" > "$signing_key_file"
          unset SEAMS_RELEASE_SIGNING_KEY
          exec 3< "$signing_key_file"
          crates/seams-cli/target/release/seams-release-manifest \
            --release-version "$SEAMS_RELEASE_VERSION" \
            --source-revision "${GITHUB_SHA}" \
            --minimum-protocol-version tenant_root_operation_record_v1 \
            --signer-key-id "$SEAMS_RELEASE_SIGNER_KEY_ID" \
            --signing-key-fd 3 \
            --artifact aarch64-apple-darwin=dist/seams-wallet-aarch64-apple-darwin \
            --artifact x86_64-apple-darwin=dist/seams-wallet-x86_64-apple-darwin \
            --artifact x86_64-unknown-linux-gnu=dist/seams-wallet-x86_64-unknown-linux-gnu \
            --artifact sbom=dist/seams-sbom.txt \
            > dist/seams-release-manifest.json
          exec 3<&-
          rm -f "$signing_key_file"

      - name: Verify the release with the binary that ships
        run: |
          set -euo pipefail
          # The Linux binary in this release verifies every artifact against
          # the manifest using only the release root compiled into it. This
          # fails if the signing key is not the pinned root, if any artifact
          # was altered after signing, or if the manifest omits one.
          chmod +x dist/seams-wallet-x86_64-unknown-linux-gnu
          for target in $SEAMS_TARGETS; do
            dist/seams-wallet-x86_64-unknown-linux-gnu release verify \
              --manifest dist/seams-release-manifest.json \
              --artifact "dist/seams-wallet-${target}"
          done
          dist/seams-wallet-x86_64-unknown-linux-gnu release verify \
            --manifest dist/seams-release-manifest.json \
            --artifact dist/seams-sbom.txt

      - uses: actions/upload-artifact@v4
        with:
          name: seams-release-${{ inputs.release_version }}
          path: |
            dist/seams-*
            dist/seams-release-manifest.json
            dist/seams-sbom.txt
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: seams-release-${{ inputs.release_version }}
          path: dist

      - name: Create the release from the verified artifact set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="seams-cli-v${SEAMS_RELEASE_VERSION}"
          notes="Recovery tooling release ${SEAMS_RELEASE_VERSION} built from ${GITHUB_SHA}.

          Verify a download with the binary itself before using it:

              seams-wallet release verify --manifest seams-release-manifest.json --artifact <downloaded file>

          The manifest is signed by the CI-held release root compiled into every seams binary."
          gh release create "$tag" \
            --target "${GITHUB_SHA}" \
            --title "seams CLI ${SEAMS_RELEASE_VERSION}" \
            --notes "$notes" \
            dist/seams-wallet-aarch64-apple-darwin \
            dist/seams-wallet-x86_64-apple-darwin \
            dist/seams-wallet-x86_64-unknown-linux-gnu \
            dist/seams-release-manifest.json \
            dist/seams-sbom.txt

  publish_npm:
    name: Publish npm launcher
    needs: publish
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Validate launcher version
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./packages/seams-cli/package.json').version")"
          test "$package_version" = "$SEAMS_RELEASE_VERSION"

      - name: Use npm trusted publishing
        run: npm install --global npm@latest

      - name: Publish @seams/wallet-cli
        working-directory: packages/seams-cli
        run: npm publish --access public --provenance
