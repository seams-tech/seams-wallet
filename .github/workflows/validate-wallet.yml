name: Validate wallet

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-wallet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build public Wallet boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack and Worker builder
        run: |
          cargo install wasm-pack --locked
          cargo install worker-build --version 0.8.4 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm type-check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm -C tests test:intended:representative
        env:
          SEAMS_INTENDED_SKIP_BUILD: '1'
      - run: pnpm check:packed-wallet
      - run: pnpm build:docs
      - run: pnpm build:example
      - name: Build Wallet intended test app
        env:
          VITE_WALLET_ORIGIN: https://localhost:4002
          VITE_RELAYER_URL: https://localhost:4101
          VITE_SEAMS_PROJECT_ENVIRONMENT_ID: local-wallet-test:dev
          VITE_SEAMS_PUBLISHABLE_KEY: pk_local_wallet_test
          VITE_ROUTER_AB_NORMAL_SIGNING_WORKER_ID: local-signing-worker
        run: pnpm build:test-app
      - run: pnpm build:self-host
      - name: Start and smoke the self-host runtime
        run: |
          set -euo pipefail
          runtime_log="$RUNNER_TEMP/seams-self-host-runtime.log"
          pnpm -C examples/self-host-cloudflare-worker exec wrangler dev \
            --local \
            --ip 127.0.0.1 \
            --port 18799 \
            --var RELAYER_ACCOUNT_ID:self-host-smoke.testnet \
            --var RELAYER_PRIVATE_KEY:ed25519:local \
            --log-level error >"$runtime_log" 2>&1 &
          runtime_pid=$!
          trap 'kill "$runtime_pid" 2>/dev/null || true; wait "$runtime_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:18799/healthz >/dev/null && \
              curl -fsS http://127.0.0.1:18799/readyz >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$runtime_pid" 2>/dev/null; then
              cat "$runtime_log"
              exit 1
            fi
            sleep 1
          done
          cat "$runtime_log"
          exit 1
