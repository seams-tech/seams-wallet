name: Validate wallet

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-wallet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build public Wallet boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        id: rust-toolchain
        with:
          targets: wasm32-unknown-unknown
      # Upstream prebuilt binaries with pinned SHA-256 digests. Compiling the
      # four wasm-bindgen CLIs from source took 11-13 minutes of every build.
      # GH_TOKEN makes the downloads authenticated API calls, because GitHub
      # can answer anonymous release downloads with 504 under load.
      - name: Install prebuilt wasm-pack and wasm-bindgen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash packages/wallet/scripts/build/install-prebuilt-wasm-tools.sh \
            --wasm-pack-dir "$RUNNER_TEMP/wasm-pack"
          echo "$RUNNER_TEMP/wasm-pack" >> "$GITHUB_PATH"
      # worker-build has no upstream prebuilt binary, so this job keeps the one
      # it compiled. CARGO_INSTALL_ROOT makes every later `cargo install
      # worker-build` in this job (wrangler build commands) find it.
      - name: Restore Worker builder
        uses: actions/cache@v6
        with:
          path: ~/.cache/seams-ci/worker-build-0.8.4
          key: worker-build-0.8.4-${{ env.ImageOS }}-${{ runner.arch }}
      - name: Install Worker builder
        run: |
          root="$HOME/.cache/seams-ci/worker-build-0.8.4"
          echo "CARGO_INSTALL_ROOT=$root" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"
          CARGO_INSTALL_ROOT="$root" cargo install worker-build --version 0.8.4 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm report:bloat --check
      - run: pnpm check:cargo-locks
      # The Rust outputs (WASM packages, release Workers, local tools) are
      # cached by the exact content of every tracked file that can change
      # them, and by the rustc version. Most pushes change no Rust input, and
      # the Rust build took about 30 of this job's minutes. There is no
      # partial-key fallback: a restored output always matches its inputs.
      # The release workflow never uses this cache; it builds from source.
      - name: Hash Rust build inputs
        id: rust-inputs
        run: |
          set -euo pipefail
          hash="$(git ls-tree -r HEAD -- \
            crates wasm tools .cargo package.json \
            packages/wallet/build-paths.sh packages/wallet/scripts/build \
            scripts/build-local-tools.mjs .github/workflows/validate-wallet.yml \
            | sha256sum | cut -c1-40)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Restore Rust build outputs
        id: rust-outputs
        uses: actions/cache/restore@v6
        with:
          key: rust-outputs-v1-${{ runner.os }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ steps.rust-inputs.outputs.hash }}
          path: |
            wasm/*/pkg
            crates/router-ab-ed25519-yao-client/pkg
            crates/router-ab-cloudflare/build/signing-worker
            crates/router-ab-cloudflare/build/deriver-a
            crates/router-ab-cloudflare/build/deriver-b
            crates/router-ab-cloudflare/build/router
            crates/router-ab-cloudflare/build/tenant-root-control-plane
            crates/router-ab-cloudflare/build/local-tools
      - name: Build Rust WASM packages, Workers and local tools
        if: steps.rust-outputs.outputs.cache-hit != 'true'
        run: pnpm run build:wasm && pnpm run build:workers && pnpm run build:local-tools
      - name: Save Rust build outputs
        if: steps.rust-outputs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.rust-outputs.outputs.cache-primary-key }}
          path: |
            wasm/*/pkg
            crates/router-ab-ed25519-yao-client/pkg
            crates/router-ab-cloudflare/build/signing-worker
            crates/router-ab-cloudflare/build/deriver-a
            crates/router-ab-cloudflare/build/deriver-b
            crates/router-ab-cloudflare/build/router
            crates/router-ab-cloudflare/build/tenant-root-control-plane
            crates/router-ab-cloudflare/build/local-tools
      - name: Check restored Rust build outputs
        if: steps.rust-outputs.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          WASM_SDK_USE_PREBUILT=1 pnpm run build:wasm
          for role in signing-worker deriver-a deriver-b router tenant-root-control-plane; do
            for file in index.js index_bg.wasm build-stamp.json; do
              test -f "crates/router-ab-cloudflare/build/$role/$file"
            done
          done
          test -x crates/router-ab-cloudflare/build/local-tools/linux-x64/router_ab_local_init
          # The Worker freshness guards (`requireCurrentWorkerBuild` in
          # crates/router-ab-cloudflare/scripts/test-private-d1.mjs) compare each
          # build stamp with source file times. A checkout gives every source the
          # current time, so a restored build would read as stale. The cache key
          # proves that these sources equal the ones that made the restored build,
          # so give the tracked Rust sources a time before any build stamp.
          git ls-files -z -- crates wasm | xargs -0 touch -h -d @1
      - run: pnpm run build:packages
      - run: pnpm type-check
      - name: Verify hosted signing credit and login refusal
        run: node tests/e2e/signing-credit.e2e.mjs
      - name: Upload hosted billing admission evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wallet-billing-admission-${{ github.run_id }}
          path: |
            .artifacts/signing-credit/signing-credit.json
            .artifacts/signing-credit/login-refusal.json
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Verify unused tenant authorization renewal on real Workers
        env:
          ROUTER_AB_WORKER_BUILD_PROFILE: release
        run: node crates/router-ab-cloudflare/scripts/test-grant-renewal.mjs
      - name: Upload tenant authorization renewal evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tenant-grant-renewal-${{ github.run_id }}
          path: .artifacts/grant-renewal/**/evidence.json
          if-no-files-found: ignore
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm -C tests test:wallet-browser:representative
      - name: Upload representative browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wallet-browser-${{ github.run_id }}
          path: tests/test-results/**
          if-no-files-found: ignore
      - name: Verify BYO authentication exchange
        run: node tests/e2e/external-auth.e2e.mjs
      - name: Upload BYO exchange evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wallet-external-auth-${{ github.run_id }}
          path: |
            .artifacts/external-auth/result.json
            .artifacts/external-auth/settings.png
          include-hidden-files: true
          if-no-files-found: ignore
      - run: pnpm -C tests test:wallet-unit
      - name: Verify representative Wallet lifecycle
        env:
          SEAMS_INTENDED_SKIP_BUILD: '1'
        run: pnpm -C tests test:intended:representative
      - name: Upload representative lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wallet-intended-${{ github.run_id }}
          path: |
            tests/test-results/wallet-intended/**
            tests/.artifacts/application-auth/receipt.json
            tests/.artifacts/application-auth/example.png
          include-hidden-files: true
          if-no-files-found: ignore
      - run: pnpm check:packed-wallet
      - name: Validate documentation links and snippets
        run: |
          pnpm -C apps/docs check:links
          node apps/docs/scripts/check-code-fences.mjs
      - run: pnpm build:docs
      - run: pnpm build:example
      - name: Build Wallet intended test app
        env:
          VITE_WALLET_ORIGIN: https://localhost:4002
          VITE_RELAYER_URL: https://localhost:4101
          VITE_SEAMS_PROJECT_ENVIRONMENT_ID: local-wallet-test:dev
          VITE_SEAMS_PUBLISHABLE_KEY: pk_local_wallet_test
          VITE_ROUTER_AB_NORMAL_SIGNING_WORKER_ID: local-signing-worker
        run: pnpm build:test-app
