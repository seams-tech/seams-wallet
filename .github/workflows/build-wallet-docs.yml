name: Build wallet docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wallet-docs.yml'
      - 'apps/docs/**'
      - 'packages/wallet/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: build-wallet-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build /docs artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - name: Build Wallet Wasm
        run: |
          cargo install wasm-pack --locked
          pnpm build:wasm
      - name: Build Wallet declarations
        run: pnpm -C packages/wallet build:types
      - name: Build VitePress for wallet.seams.sh/docs
        run: pnpm build:docs
      - uses: actions/upload-artifact@v7
        with:
          name: wallet-docs-${{ github.sha }}
          path: apps/docs/dist
          if-no-files-found: error
          retention-days: 30
