name: Sign recovery trust

on:
  workflow_dispatch:
    inputs:
      request_json:
        description: Certificate or revocation_snapshot request JSON (see crates/seams-cli/trust/README.md)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: recovery-trust-signing
  cancel-in-progress: false

jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    environment: recovery-signing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the signing tool before exposing the key
        run: cargo build --locked --release --manifest-path crates/seams-cli/Cargo.toml --bin seams-recovery-authority

      - name: Sign and verify the requested trust artifact
        env:
          SIGNING_REQUEST: ${{ inputs.request_json }}
          SEAMS_RECOVERY_SIGNING_KEY: ${{ secrets.SEAMS_RECOVERY_SIGNING_KEY }}
          SEAMS_RECOVERY_SIGNER_KEY_ID: ${{ secrets.SEAMS_RECOVERY_SIGNER_KEY_ID }}
        run: |
          set -euo pipefail
          pinned="$(jq -r .currentRoot.keyId crates/seams-cli/trust/recovery-trust-bundle.json)"
          test -n "$SEAMS_RECOVERY_SIGNER_KEY_ID"
          test "$pinned" = "$SEAMS_RECOVERY_SIGNER_KEY_ID"
          umask 077
          signing_key_file="$(mktemp)"
          trap 'rm -f "$signing_key_file"' EXIT
          printf '%s' "$SIGNING_REQUEST" > request.json
          printf '%s' "$SEAMS_RECOVERY_SIGNING_KEY" > "$signing_key_file"
          unset SEAMS_RECOVERY_SIGNING_KEY
          exec 3< "$signing_key_file"
          crates/seams-cli/target/release/seams-recovery-authority \
            --request request.json --signing-key-fd 3 > recovery-trust-artifact.json
          exec 3<&-

      - uses: actions/upload-artifact@v4
        with:
          name: recovery-trust-${{ github.run_id }}
          path: recovery-trust-artifact.json
          if-no-files-found: error
