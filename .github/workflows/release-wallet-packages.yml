name: Release wallet packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Wallet, server, and VoiceID package version
        required: true
        type: string
      package:
        description: >-
          Packages to publish, in the order server, wallet, voiceid; wallet and voiceid
          retry a partial release from that package onward
        required: true
        default: all
        type: choice
        options:
          - all
          - wallet
          - voiceid

permissions:
  actions: read
  checks: read
  contents: read
  id-token: write

jobs:
  # The release Workers and the local tools come from Rust alone. When none of their inputs
  # changed since the last published server package, that package's files are reused
  # (scripts/reuse-published-rust-outputs.mjs says when, and why the bytes are the same).
  # Reused Workers skip about 17 minutes of build and the worker-build install; reused local
  # tools skip the Linux and macOS runners. The WASM packages always build from source.
  rust_outputs_reuse:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      workers: ${{ steps.workers.outputs.reuse }}
      local_tools: ${{ steps.local-tools.outputs.reuse }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # The same toolchain as the builds below: a reused binary must name its rustc commit.
      - uses: dtolnay/rust-toolchain@stable
      - id: workers
        run: node scripts/reuse-published-rust-outputs.mjs workers
      - id: local-tools
        run: node scripts/reuse-published-rust-outputs.mjs local-tools
      - if: steps.workers.outputs.reuse == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: workers-reused
          path: |
            crates/router-ab-cloudflare/build
            !crates/router-ab-cloudflare/build/local-tools
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - if: steps.local-tools.outputs.reuse == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: local-tools-reused
          path: crates/router-ab-cloudflare/build/local-tools
          if-no-files-found: error
          retention-days: 1

  local_tools:
    needs: rust_outputs_reuse
    if: github.ref == 'refs/heads/main' && needs.rust_outputs_reuse.outputs.local_tools != 'true'
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - run: node scripts/build-local-tools.mjs "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: local-tools-${{ env.TARGET }}
          path: crates/router-ab-cloudflare/build/local-tools
          if-no-files-found: error
          retention-days: 1

  mac_local_tools:
    needs: rust_outputs_reuse
    if: github.ref == 'refs/heads/main' && needs.rust_outputs_reuse.outputs.local_tools != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: node scripts/build-local-tools.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: local-tools-${{ matrix.target }}
          path: crates/router-ab-cloudflare/build/local-tools
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [rust_outputs_reuse, local_tools, mac_local_tools]
    # A skipped local-tools build means its binaries were reused, so only a failure stops the release.
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' }}
    name: Publish npm packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: npm-release
    env:
      SEAMS_RELEASE_PACKAGE: ${{ inputs.package }}
      # A pre-release version must not become the default install.
      NPM_DIST_TAG: ${{ contains(inputs.version, '-') && 'next' || 'latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Validate package versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./packages/wallet/package.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./packages/wallet-server/package.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./packages/voiceid/package.json').version")" = "$RELEASE_VERSION"
      # wasm-pack and wasm-bindgen: upstream prebuilt binaries with pinned
      # SHA-256 digests. GH_TOKEN makes their downloads authenticated API
      # calls, because GitHub can answer anonymous release downloads with 504
      # under load. worker-build has no upstream prebuilt binary; the release
      # compiles it from source and never restores it from a cache. Only a
      # server release that does not reuse the Workers needs it.
      # scripts/reuse-published-rust-outputs.mjs reads the worker-build pin from
      # the `cargo install` line, so keep its form.
      - name: Install build tools
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_WORKERS: ${{ inputs.package == 'all' && needs.rust_outputs_reuse.outputs.workers != 'true' }}
        run: |
          bash packages/wallet/scripts/build/install-prebuilt-wasm-tools.sh \
            --wasm-pack-dir "$RUNNER_TEMP/wasm-pack"
          echo "$RUNNER_TEMP/wasm-pack" >> "$GITHUB_PATH"
          if [ "$BUILD_WORKERS" = true ]; then
            cargo install worker-build --version 0.8.4 --locked
          fi
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: local-tools-*
          merge-multiple: true
          path: crates/router-ab-cloudflare/build/local-tools
      - name: Require every local tool platform
        run: |
          set -euo pipefail
          for platform in darwin-arm64 darwin-x64 linux-x64; do
            test -s "crates/router-ab-cloudflare/build/local-tools/$platform/router_ab_local_init"
          done
      - run: chmod +x crates/router-ab-cloudflare/build/local-tools/*/router_ab_local_init
      - if: inputs.package == 'all' && needs.rust_outputs_reuse.outputs.workers == 'true'
        uses: actions/download-artifact@v8
        with:
          name: workers-reused
          path: crates/router-ab-cloudflare/build
      # The jobs above put every local tool in place, so the build does not build them again.
      - name: Build production Wallet artifacts
        env:
          WASM_SDK_BUILD_MODE: prod
          REUSE_WORKERS: ${{ needs.rust_outputs_reuse.outputs.workers }}
        run: |
          set -euo pipefail
          case "$SEAMS_RELEASE_PACKAGE" in
            all)
              pnpm run build:wasm
              if [ "$REUSE_WORKERS" = true ]; then
                echo "Using the reused Workers."
              else
                pnpm run build:workers
              fi
              for role in router deriver-a deriver-b signing-worker tenant-root-control-plane; do
                grep -q '"profile":"release"' "crates/router-ab-cloudflare/build/$role/build-stamp.json"
                test -s "crates/router-ab-cloudflare/build/$role/index_bg.wasm"
              done
              pnpm run build:packages
              ;;
            wallet|voiceid)
              pnpm -C packages/wallet build:sdk-full
              pnpm -C packages/voiceid build
              ;;
            *)
              echo "Unsupported release package: $SEAMS_RELEASE_PACKAGE" >&2
              exit 1
              ;;
          esac
      - run: pnpm check:packed-wallet "$SEAMS_RELEASE_PACKAGE"
      - name: Build versioned Wallet documentation
        run: pnpm build:docs
      - uses: actions/upload-artifact@v7
        with:
          name: wallet-docs-${{ inputs.version }}-${{ github.sha }}
          path: apps/docs/dist
          if-no-files-found: error
          retention-days: 90
      - name: Use npm trusted publishing
        run: npm install --global npm@latest
      - name: Retain release packages
        run: |
          mkdir -p .artifacts/npm
          if [ "$SEAMS_RELEASE_PACKAGE" = all ]; then
            npm pack ./packages/wallet-server --pack-destination .artifacts/npm
          fi
          if [ "$SEAMS_RELEASE_PACKAGE" = all ] || [ "$SEAMS_RELEASE_PACKAGE" = wallet ]; then
            npm pack ./packages/wallet --pack-destination .artifacts/npm
          fi
          npm pack ./packages/voiceid --pack-destination .artifacts/npm
      - uses: actions/upload-artifact@v7
        with:
          name: wallet-packages-${{ inputs.version }}-${{ github.sha }}
          path: .artifacts/npm/*.tgz
          if-no-files-found: error
          retention-days: 30
      - name: Require successful Wallet validation for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Wallet validation does not cover this workflow, so commits that change only this
          # file reuse the validation of the newest commit before them that changed anything else.
          validated_commit="$GITHUB_SHA"
          while git rev-parse -q --verify "$validated_commit^" >/dev/null &&
            [ -z "$(git diff --name-only "$validated_commit^" "$validated_commit" -- . ':(exclude).github/workflows/release-wallet-packages.yml')" ]; do
            validated_commit="$(git rev-parse "$validated_commit^")"
          done
          echo "Requiring Wallet validation of $validated_commit."
          wallet_validation_run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow validate-wallet.yml \
            --commit "$validated_commit" \
            --event push \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          if [ -z "$wallet_validation_run_id" ] || [ "$wallet_validation_run_id" = null ]; then
            echo "No Wallet validation run exists for $validated_commit." >&2
            exit 1
          fi
          gh run watch "$wallet_validation_run_id" \
            --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
      - name: Publish @seams/wallet-server
        if: inputs.package == 'all'
        working-directory: packages/wallet-server
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
      - name: Publish @seams/wallet
        if: inputs.package == 'all' || inputs.package == 'wallet'
        working-directory: packages/wallet
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
      - name: Publish @seams/voiceid
        working-directory: packages/voiceid
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
