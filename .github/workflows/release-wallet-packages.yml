name: Release wallet packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Wallet, server, and VoiceID package version
        required: true
        type: string
      package:
        description: Packages to publish; wallet and voiceid support partial-release retries
        required: true
        default: all
        type: choice
        options:
          - all
          - wallet
          - voiceid

permissions:
  contents: read
  id-token: write

jobs:
  local_tools:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: node scripts/build-local-tools.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: local-tools-${{ matrix.target }}
          path: crates/router-ab-cloudflare/build/local-tools
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: local_tools
    if: github.ref == 'refs/heads/main'
    name: Publish npm packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: npm-release
    env:
      SEAMS_RELEASE_PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Validate package versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./packages/wallet/package.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./packages/wallet-server/package.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./packages/voiceid/package.json').version")" = "$RELEASE_VERSION"
      - name: Install build tools
        run: |
          cargo install wasm-pack --locked
          cargo install worker-build --version 0.8.4 --locked
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: local-tools-*
          merge-multiple: true
          path: crates/router-ab-cloudflare/build/local-tools
      - run: chmod +x crates/router-ab-cloudflare/build/local-tools/*/router_ab_local_init
      - name: Build production Wallet artifacts
        env:
          WASM_SDK_BUILD_MODE: prod
        run: |
          case "$SEAMS_RELEASE_PACKAGE" in
            all)
              pnpm build
              ;;
            wallet|voiceid)
              pnpm -C packages/wallet build:sdk-full
              pnpm -C packages/voiceid build
              ;;
            *)
              echo "Unsupported release package: $SEAMS_RELEASE_PACKAGE" >&2
              exit 1
              ;;
          esac
      - run: pnpm check:packed-wallet "$SEAMS_RELEASE_PACKAGE"
      - name: Build versioned Wallet documentation
        run: pnpm build:docs
      - uses: actions/upload-artifact@v7
        with:
          name: wallet-docs-${{ inputs.version }}-${{ github.sha }}
          path: apps/docs/dist
          if-no-files-found: error
          retention-days: 90
      - name: Use npm trusted publishing
        run: npm install --global npm@latest
      - name: Retain release packages
        run: |
          mkdir -p .artifacts/npm
          if [ "$SEAMS_RELEASE_PACKAGE" = all ]; then
            npm pack ./packages/wallet-server --pack-destination .artifacts/npm
          fi
          if [ "$SEAMS_RELEASE_PACKAGE" != voiceid ]; then
            npm pack ./packages/wallet --pack-destination .artifacts/npm
          fi
          npm pack ./packages/voiceid --pack-destination .artifacts/npm
      - uses: actions/upload-artifact@v7
        with:
          name: wallet-packages-${{ inputs.version }}-${{ github.sha }}
          path: .artifacts/npm/*.tgz
          if-no-files-found: error
          retention-days: 30
      - name: Publish @seams/wallet-server
        if: inputs.package == 'all'
        working-directory: packages/wallet-server
        run: npm publish --access public --provenance
      - name: Publish @seams/wallet
        if: inputs.package != 'voiceid'
        working-directory: packages/wallet
        run: npm publish --access public --provenance
      - name: Publish @seams/voiceid
        working-directory: packages/voiceid
        run: npm publish --access public --provenance
