[package]
name = "seams-recovery-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native secret core for the seams derivation-root recovery CLI"
license = "Apache-2.0"

[lib]
name = "seams_recovery_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
base64ct = { version = "=1.8.3", features = ["alloc"] }
ed25519-dalek = { version = "=2.2.0", default-features = false }
rand_core_09 = { package = "rand_core", version = "=0.9.5" }
router-ab-core = { path = "../router-ab-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
zeroize = { version = "=1.9.0", features = ["zeroize_derive"] }

[dev-dependencies]
base64ct = { version = "=1.8.3", features = ["alloc"] }
ed25519-dalek = { version = "=2.2.0", default-features = false }
sha2 = "=0.10.9"
rand_chacha_09 = { package = "rand_chacha", version = "=0.9.0", default-features = false }

[profile.test]
opt-level = 2
