[package]
name = "ed25519-yao-cloudflare-bench"
version = "0.1.0"
edition = "2021"
description = "Isolated Cloudflare streaming benchmark for Ed25519 Yao Derivers A and B"
license = "Apache-2.0"
publish = false

[lib]
name = "ed25519_yao_cloudflare_bench"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
ml-dsa-a = ["ed25519-yao/ml-dsa-runtime-benchmark"]
ml-dsa-b = ["ed25519-yao/ml-dsa-runtime-benchmark"]
deriver-a = []
deriver-a-cross-account = []
deriver-a-same-account-rpc = ["deriver-a"]
deriver-a-same-account-websocket = []
deriver-b = []
deriver-b-cross-account = []
deriver-b-same-account-rpc = ["deriver-b"]
deriver-b-same-account-websocket = []
fault-fragmentation = []
fault-request-disconnect-after-base-choices = []
fault-response-disconnect-after-offer = []
fault-trailing-after-terminal = []
fault-short-timeout = []
fault-stall-after-offer = []
fault-wrong-role-offer-tag = []
fault-session-mismatch = []
# Deriver A yields to the event loop after each table frame, so the frame
# leaves before the next one is garbled. Measurement only.
yield-after-table-frame = []

[dependencies]
bytes = "=1.12.1"
ed25519-yao = { path = "../ed25519-yao", features = ["phase9-role-benchmark", "local-protocol"] }
futures-channel = { version = "=0.3.32", features = ["sink"] }
futures-core = "=0.3.32"
futures-util = { version = "=0.3.32", features = ["sink"] }
getrandom = { version = "=0.2.17", features = ["js"] }
hpke-ng = "=0.1.0"
http = "=1.4.2"
http-body = "=1.0.1"
http-body-util = "=0.1.3"
rand_chacha = "=0.3.1"
rand_chacha_09 = { package = "rand_chacha", version = "=0.9.0", default-features = false }
rand_core = "=0.6.4"
rand_core_09 = { package = "rand_core", version = "=0.9.5" }
serde_json = "=1.0.150"
signer-core = { path = "../signer-core", features = ["ed25519-yao-derivation"] }
threshold-prf = { path = "../threshold-prf" }
worker = { version = "=0.8.5", features = ["http"] }
worker-sys = "=0.8.5"
wasm-bindgen = "=0.2.126"
wasm-streams = "=0.6.0"
url = "=2.5.8"
zeroize = "=1.9.0"
