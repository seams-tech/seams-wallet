[package]
name = "spoken-intent"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Canonical spoken text, parsing and digests for voice-confirmed NEAR requests"
license = "Apache-2.0"

[lib]
name = "spoken_intent"
path = "src/lib.rs"

[dependencies]
borsh = { version = "=1.6.1", default-features = false, features = ["derive"] }
sha2 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
serde_json = "=1.0.151"
