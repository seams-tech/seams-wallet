name = "router-ab-deriver-a"
main = "build/deriver-a/worker/shim.mjs"
compatibility_date = "2026-06-12"
workers_dev = false

[build]
command = "cargo install -q worker-build --version 0.8.4 && bash ./scripts/build-strict-worker.sh deriver-a"

[[d1_databases]]
binding = "DERIVER_ROLE_PRIVATE_DB"
database_name = "router-ab-deriver-a-private"
# deploy-backend.mjs replaces this lane placeholder before remote migration and deployment.
database_id = "__PRODUCTION_MAINNET_DERIVER_A_PRIVATE_D1_ID__"
migrations_dir = "migrations/deriver-a"

[[r2_buckets]]
binding = "TENANT_ROOT_MANAGED_BACKUP_BUCKET"
bucket_name = "router-ab-deriver-a-tenant-root-managed-backup"

# R120: read authoritative tenant-root creation state directly from the
# Router-owned Durable Object. The class, namespace, migrations and storage
# stay owned by the Router manifest; this is an external binding, and the
# object independently verifies every signed command it is given.
[[durable_objects.bindings]]
name = "ROUTER_TENANT_ROOT_CREATION_DO"
class_name = "RouterAbTenantRootCreationDurableObject"
script_name = "router-ab-mpc-router"

[[services]]
binding = "DERIVER_B"
service = "router-ab-deriver-b"

[vars]
ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET_BINDING = "ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET"
DERIVER_ROLE_PRIVATE_D1_KEK_BINDING = "DERIVER_A_ROLE_PRIVATE_D1_KEK"
DERIVER_ROLE_PRIVATE_D1_ROLE = "deriver_a"
DERIVER_A_ENVELOPE_HPKE_PRIVATE_KEY_BINDING = "DERIVER_A_ENVELOPE_HPKE_PRIVATE_KEY"
DERIVER_A_ENVELOPE_HPKE_KEY_EPOCH = "epoch-1"
DERIVER_B_ENVELOPE_HPKE_KEY_EPOCH = "epoch-1"
DERIVER_A_PEER_SIGNING_KEY_BINDING = "DERIVER_A_PEER_SIGNING_KEY"
DERIVER_A_PEER_SIGNING_KEY_EPOCH = "epoch-1"
DERIVER_B_PEER_BINDING = "DERIVER_B"

[env.staging]
name = "router-ab-deriver-a-staging"
workers_dev = false

[[env.staging.d1_databases]]
binding = "DERIVER_ROLE_PRIVATE_DB"
database_name = "router-ab-deriver-a-staging-private"
# deploy-backend.mjs replaces this lane placeholder before remote migration and deployment.
database_id = "__STAGING_TESTNET_DERIVER_A_PRIVATE_D1_ID__"
migrations_dir = "migrations/deriver-a"

[[env.staging.r2_buckets]]
binding = "TENANT_ROOT_MANAGED_BACKUP_BUCKET"
bucket_name = "router-ab-deriver-a-staging-tenant-root-managed-backup"

[[env.staging.durable_objects.bindings]]
name = "ROUTER_TENANT_ROOT_CREATION_DO"
class_name = "RouterAbTenantRootCreationDurableObject"
script_name = "router-ab-mpc-router-staging"

[[env.staging.services]]
binding = "DERIVER_B"
service = "router-ab-deriver-b-staging"

[env.staging.vars]
ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET_BINDING = "ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET"
DERIVER_ROLE_PRIVATE_D1_KEK_BINDING = "DERIVER_A_ROLE_PRIVATE_D1_KEK"
DERIVER_ROLE_PRIVATE_D1_ROLE = "deriver_a"
DERIVER_A_ENVELOPE_HPKE_PRIVATE_KEY_BINDING = "DERIVER_A_ENVELOPE_HPKE_PRIVATE_KEY"
DERIVER_A_ENVELOPE_HPKE_KEY_EPOCH = "epoch-1"
DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY = "x25519:2693d0896a85398a7bef705c714590bbd99e0c91be62323d33c421d5be597257"
DERIVER_B_ENVELOPE_HPKE_KEY_EPOCH = "epoch-1"
DERIVER_A_PEER_SIGNING_KEY_BINDING = "DERIVER_A_PEER_SIGNING_KEY"
DERIVER_A_PEER_SIGNING_KEY_EPOCH = "epoch-1"
DERIVER_A_PEER_VERIFYING_KEY_HEX = "d6d21d388a92e6eb9d85d9fcdbcba81c383d7102717b7160fab5e2b501555907"
DERIVER_B_PEER_VERIFYING_KEY_HEX = "1a369e342f555305e278312f3b704465e11fadbbab09134ed897402ed65c2d4a"
DERIVER_B_PEER_BINDING = "DERIVER_B"

[env.production-testnet]
name = "router-ab-deriver-a-testnet"
workers_dev = false

[[env.production-testnet.d1_databases]]
binding = "DERIVER_ROLE_PRIVATE_DB"
database_name = "router-ab-deriver-a-testnet-private"
# deploy-backend.mjs replaces this lane placeholder before remote migration and deployment.
database_id = "__PRODUCTION_TESTNET_DERIVER_A_PRIVATE_D1_ID__"
migrations_dir = "migrations/deriver-a"

[[env.production-testnet.r2_buckets]]
binding = "TENANT_ROOT_MANAGED_BACKUP_BUCKET"
bucket_name = "router-ab-deriver-a-testnet-tenant-root-managed-backup"

[[env.production-testnet.durable_objects.bindings]]
name = "ROUTER_TENANT_ROOT_CREATION_DO"
class_name = "RouterAbTenantRootCreationDurableObject"
script_name = "router-ab-mpc-router-testnet"

[[env.production-testnet.services]]
binding = "DERIVER_B"
service = "router-ab-deriver-b-testnet"

[env.production-testnet.vars]
ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET_BINDING = "ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET"
DERIVER_ROLE_PRIVATE_D1_KEK_BINDING = "DERIVER_A_ROLE_PRIVATE_D1_KEK"
DERIVER_ROLE_PRIVATE_D1_ROLE = "deriver_a"
DERIVER_A_ENVELOPE_HPKE_PRIVATE_KEY_BINDING = "DERIVER_A_ENVELOPE_HPKE_PRIVATE_KEY"
DERIVER_A_ENVELOPE_HPKE_KEY_EPOCH = "epoch-1"
DERIVER_B_ENVELOPE_HPKE_KEY_EPOCH = "epoch-1"
DERIVER_A_PEER_SIGNING_KEY_BINDING = "DERIVER_A_PEER_SIGNING_KEY"
DERIVER_A_PEER_SIGNING_KEY_EPOCH = "epoch-1"
DERIVER_B_PEER_BINDING = "DERIVER_B"

[observability]
enabled = true
  [observability.logs]
  enabled = true
  head_sampling_rate = 1
  invocation_logs = true
  [observability.traces]
  enabled = true
  head_sampling_rate = 1
