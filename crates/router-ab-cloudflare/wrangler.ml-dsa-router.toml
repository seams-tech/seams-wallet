name = "router-ab-ml-dsa-router"
main = "build/ml-dsa/router/worker/shim.mjs"
compatibility_date = "2026-06-12"
workers_dev = false
preview_urls = false

[vars]
ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET_BINDING = "ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET"

[[services]]
binding = "DERIVER_A"
service = "router-ab-ml-dsa-a"

[[services]]
binding = "DERIVER_B"
service = "router-ab-ml-dsa-b"

[[durable_objects.bindings]]
name = "ML_DSA_ADMISSION_DO"
class_name = "RouterAbMlDsaAdmissionDurableObject"

[[migrations]]
tag = "registration-v1"
new_sqlite_classes = ["RouterAbMlDsaAdmissionDurableObject"]

[build]
command = "bash scripts/build-strict-worker.sh router ml-dsa"
