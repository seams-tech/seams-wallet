name = "router-ab-mpc-router"
main = "build/router/worker/shim.mjs"
compatibility_date = "2026-06-12"
workers_dev = false

[build]
command = "cargo install -q worker-build --version 0.8.4 && bash ./scripts/build-strict-worker.sh router"

[durable_objects]
bindings = [
  { name = "ROUTER_TENANT_ROOT_CREATION_DO", class_name = "RouterAbTenantRootCreationDurableObject" },
]

[[migrations]]
tag = "router_ab_router_tenant_root_creation_v1"
new_sqlite_classes = ["RouterAbTenantRootCreationDurableObject"]

[[services]]
binding = "DERIVER_A"
service = "router-ab-deriver-a"

[[services]]
binding = "DERIVER_B"
service = "router-ab-deriver-b"

[[services]]
binding = "SIGNING_WORKER"
service = "router-ab-signing-worker"

[[services]]
binding = "TENANT_ROOT_CONTROL_PLANE"
service = "router-ab-tenant-root-control-plane"

[vars]
ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET_BINDING = "ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET"
ROUTER_JWT_AUDIENCE = "router-ab"
DERIVER_A_ENVELOPE_HPKE_KEY_EPOCH = "epoch-1"
DERIVER_B_ENVELOPE_HPKE_KEY_EPOCH = "epoch-1"
SIGNING_WORKER_SERVER_OUTPUT_HPKE_KEY_EPOCH = "epoch-1"
DERIVER_A_PEER_BINDING = "DERIVER_A"
DERIVER_B_PEER_BINDING = "DERIVER_B"
SIGNING_WORKER_PEER_BINDING = "SIGNING_WORKER"

# Deployment targets keep Worker names and service bindings explicit.
[env.staging]
name = "router-ab-mpc-router-staging"
workers_dev = true

[[env.staging.durable_objects.bindings]]
name = "ROUTER_TENANT_ROOT_CREATION_DO"
class_name = "RouterAbTenantRootCreationDurableObject"

[[env.staging.services]]
binding = "DERIVER_A"
service = "router-ab-deriver-a-staging"

[[env.staging.services]]
binding = "DERIVER_B"
service = "router-ab-deriver-b-staging"

[[env.staging.services]]
binding = "SIGNING_WORKER"
service = "router-ab-signing-worker-staging"

[[env.staging.services]]
binding = "TENANT_ROOT_CONTROL_PLANE"
service = "router-ab-tenant-root-control-plane-staging"

[env.staging.vars]
ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET_BINDING = "ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET"
ROUTER_JWT_ISSUER = "https://staging.api.seams.sh"
ROUTER_JWT_AUDIENCE = "router-ab"
ROUTER_JWT_JWKS_JSON = "{\"keys\":[{\"alg\":\"EdDSA\",\"crv\":\"Ed25519\",\"kid\":\"router-ab-ceremony-staging-r1\",\"kty\":\"OKP\",\"use\":\"sig\",\"x\":\"sU-wLEXR48lJIg0m6-ACHKbaQnhZM8uoLQp8OVYtZH4\"}]}"
DERIVER_A_ENVELOPE_HPKE_KEY_EPOCH = "epoch-1"
DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY = "x25519:2693d0896a85398a7bef705c714590bbd99e0c91be62323d33c421d5be597257"
DERIVER_B_ENVELOPE_HPKE_KEY_EPOCH = "epoch-1"
DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY = "x25519:5e2819f555ecfcc996761ca4558551172f06052fb9f80123a88f4e0094c3b13a"
DERIVER_A_PEER_VERIFYING_KEY_HEX = "d6d21d388a92e6eb9d85d9fcdbcba81c383d7102717b7160fab5e2b501555907"
DERIVER_B_PEER_VERIFYING_KEY_HEX = "1a369e342f555305e278312f3b704465e11fadbbab09134ed897402ed65c2d4a"
SIGNING_WORKER_SERVER_OUTPUT_HPKE_KEY_EPOCH = "epoch-1"
SIGNING_WORKER_SERVER_OUTPUT_HPKE_PUBLIC_KEY = "x25519:d0a06a6445d78bc87f449dfac2b427ad1857a0b00d91e20f152031ad49c18010"
