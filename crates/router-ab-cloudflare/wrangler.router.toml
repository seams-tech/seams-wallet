DERIVER_B_PEER_BINDING = "DERIVER_B"
SIGNING_WORKER_PEER_BINDING = "SIGNING_WORKER"

[env.production-testnet]
name = "router-ab-mpc-router-testnet"
workers_dev = true

[[env.production-testnet.durable_objects.bindings]]
name = "ROUTER_TENANT_ROOT_CREATION_DO"
class_name = "RouterAbTenantRootCreationDurableObject"

[[env.production-testnet.services]]
binding = "DERIVER_A"
service = "router-ab-deriver-a-testnet"

[[env.production-testnet.services]]
binding = "DERIVER_B"
service = "router-ab-deriver-b-testnet"

[[env.production-testnet.services]]
binding = "SIGNING_WORKER"
service = "router-ab-signing-worker-testnet"

[[env.production-testnet.services]]
binding = "TENANT_ROOT_CONTROL_PLANE"
service = "router-ab-tenant-root-control-plane-testnet"

[env.production-testnet.vars]
ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET_BINDING = "ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET"
ROUTER_JWT_AUDIENCE = "router-ab"
DERIVER_A_ENVELOPE_HPKE_KEY_EPOCH = "epoch-1"
DERIVER_B_ENVELOPE_HPKE_KEY_EPOCH = "epoch-1"
SIGNING_WORKER_SERVER_OUTPUT_HPKE_KEY_EPOCH = "epoch-1"
DERIVER_A_PEER_BINDING = "DERIVER_A"
DERIVER_B_PEER_BINDING = "DERIVER_B"
SIGNING_WORKER_PEER_BINDING = "SIGNING_WORKER"

[observability]
enabled = true
  [observability.logs]
  enabled = true
  head_sampling_rate = 1
  invocation_logs = true
  [observability.traces]
  enabled = true
  head_sampling_rate = 1
