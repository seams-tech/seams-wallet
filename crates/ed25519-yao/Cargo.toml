[package]
name = "ed25519-yao"
version = "0.1.0"
edition = "2021"
description = "Strict draft manifest types for the Router A/B Ed25519 Yao protocol"
license = "Apache-2.0"
publish = false

[lib]
name = "ed25519_yao"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "benchmark_phase5_role"
path = "src/bin/benchmark_phase5_role.rs"
required-features = ["passive-benchmark"]

[features]
default = []
passive-benchmark = ["dep:two-party-primitives"]
passive-wasm-benchmark = ["dep:two-party-primitives"]
phase9-role-benchmark = ["dep:two-party-primitives"]
local-protocol = ["dep:two-party-primitives"]

[dependencies]
two-party-primitives = { path = "../two-party-primitives", optional = true }
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
getrandom = { version = "=0.2.17", features = ["js"] }
sha2 = { version = "=0.10.9", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["zeroize_derive"] }

[dev-dependencies]
two-party-primitives = { path = "../two-party-primitives", features = ["test-fixtures"] }
