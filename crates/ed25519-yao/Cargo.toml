[package]
name = "ed25519-yao"
version = "0.1.0"
edition = "2021"
description = "Strict draft manifest types for the Router A/B Ed25519 Yao protocol"
license = "Apache-2.0"
publish = false

[lib]
name = "ed25519_yao"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "benchmark_phase5_role"
path = "src/bin/benchmark_phase5_role.rs"
required-features = ["passive-benchmark"]

[features]
default = []
passive-benchmark = []
ml-dsa-runtime-benchmark = ["dep:sha3", "dep:cryprot-codes", "dep:cryprot-core", "dep:getrandom04", "dep:aes09", "dep:cipher05"]
passive-wasm-benchmark = []
phase9-role-benchmark = []
local-protocol = []

[dependencies]
aes = { version = "=0.8.4", default-features = false, features = ["zeroize"] }
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
getrandom = { version = "=0.2.17", features = ["js"] }
sha2 = { version = "=0.10.9", default-features = false }
sha3 = { version = "=0.10.9", default-features = false, optional = true }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["zeroize_derive"] }

cryprot-codes = { path = "vendor/cryprot-codes", optional = true }
cryprot-core = { path = "vendor/cryprot-core", optional = true }
getrandom04 = { package = "getrandom", version = "=0.4.3", features = ["wasm_js"], optional = true }
aes09 = { package = "aes", version = "=0.9.1", default-features = false, features = ["zeroize"], optional = true }
cipher05 = { package = "cipher", version = "=0.5.2", default-features = false, features = ["zeroize"], optional = true }
