[package]
publish = false
description = "Core primitives for cryptographic protocol implementations."
edition = "2024"
keywords = ["cryptography", "mpc"]
license = "MIT"
name = "cryprot-core"
version = "0.3.4"

authors = ["Robin Hundt"]
repository = "https://github.com/robinhundt/CryProt"

[lints.clippy]
unwrap_used = "warn"

[lib]
bench = false

[features]
__testing = ["dep:tracing-subscriber"]
num-traits = ["dep:num-traits"]
tokio-rayon = ["dep:rayon", "dep:tokio"]

[dependencies]
aes = "=0.9.1"
blake3 = { version = "1.8.5", features = ["serde", "traits-preview"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
hybrid-array = { version = "0.4.12", features = ["bytemuck"] }
num-traits = { version = "0.2.19", optional = true }
rand = "0.10.0"
rand_core = "0.10.0"
rand_core_0_6 = { package = "rand_core", version = "0.6" }
rayon = { version = "1.10.0", optional = true }
seq-macro = "=0.3.6"
serde = { version = "1.0.203", features = ["derive"] }
subtle = { version = "2.6.1", features = ["const-generics"] }
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["sync"], optional = true }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.23", optional = true }
wide = { version = "1.4.0", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }
proptest = "1.11.0"

[build-dependencies]
rustc_version = "0.4.1"

[[bench]]
harness = false
name = "bench"

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
cpufeatures = "0.3.0"
