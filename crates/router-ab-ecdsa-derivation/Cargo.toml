[package]
name = "router-ab-ecdsa-derivation"
version = "0.1.0"
edition = "2021"
publish = false
description = "Router A/B ECDSA role-local derivation and threshold-signing boundary"
license = "Apache-2.0"

[lib]
name = "router_ab_ecdsa_derivation"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bench]]
name = "performance_baseline"
harness = false

[dependencies]
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic"] }
sha2 = "=0.10.9"
sha3 = "=0.10.9"
zeroize = { version = "=1.9.0", features = ["zeroize_derive"] }

[dev-dependencies]
criterion = "=0.5.1"
hex = "=0.4.3"
serde_json = "=1.0.149"
