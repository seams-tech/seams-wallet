[package]
name = "router-ab-dev"
version = "0.1.0"
edition = "2021"
publish = false
description = "Worker deployment inputs and Router/A/B protocol evidence tools"
license = "Apache-2.0"

[lib]
name = "router_ab_dev"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
base64 = "0.22"
curve25519-dalek = { version = "=4.1.3", features = ["zeroize"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
getrandom = { version = "0.2.17", features = ["std"] }
hex = "0.4"
hpke-ng = "0.1.0"
frost-ed25519 = "2.2"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rand_core_09 = { package = "rand_core", version = "0.9.5", features = ["os_rng"] }
router-ab-core = { path = "../router-ab-core" }
router-ab-cloudflare = { path = "../router-ab-cloudflare", default-features = false }
router-ab-ed25519-yao = { path = "../router-ab-ed25519-yao" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signer-core = { path = "../signer-core", features = [
    "ed25519-yao-derivation",
    "near-threshold-ed25519",
] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
router-ab-ecdsa-derivation = { path = "../router-ab-ecdsa-derivation" }
router-ab-ed25519-yao-client = { path = "../router-ab-ed25519-yao-client" }
