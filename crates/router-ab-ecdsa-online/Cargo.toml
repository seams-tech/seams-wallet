[package]
name = "router-ab-ecdsa-online"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fixed-role Router A/B ECDSA online client kernel"
license = "Apache-2.0"

[dependencies]
hkdf = "=0.12.4"
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "ecdsa"] }
sha3 = "=0.10.9"
subtle = "=2.6.1"
zeroize = { version = "=1.9.0", features = ["zeroize_derive"] }

[dev-dependencies]
