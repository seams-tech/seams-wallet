[package]
name = "router-ab-ecdsa-client-protocol"
version = "0.1.0"
edition = "2021"
description = "Client-safe public wire and verification protocol for Router A/B ECDSA"
license = "Apache-2.0"
publish = false

[lib]
name = "router_ab_ecdsa_client_protocol"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = ["hpke"]
hpke = [
  "dep:hpke-ng",
  "dep:rand_chacha",
  "dep:rand_core",
  "dep:zeroize",
]

[dependencies]
base64ct = { version = "=1.8.3", features = ["alloc"] }
curve25519-dalek = { version = "=4.1.3", features = ["digest", "precomputed-tables"] }
hpke-ng = { version = "=0.1.0", optional = true }
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr"] }
rand_chacha = { version = "=0.9.0", optional = true }
rand_core = { version = "=0.9.5", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
zeroize = { version = "=1.9.0", optional = true }

[dev-dependencies]
router-ab-ecdsa-derivation = { path = "../router-ab-ecdsa-derivation" }
