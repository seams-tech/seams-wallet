[package]
name = "threshold-prf"
version = "0.1.0"
edition = "2021"
publish = false
description = "Threshold PRF prototype for signing-root server input derivation"
license = "Apache-2.0"

[lib]
name = "threshold_prf"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bench]]
name = "threshold_prf_baseline"
harness = false

[dependencies]
curve25519-dalek = { version = "=4.1.3", features = ["digest", "rand_core", "zeroize"] }
rand_core = "=0.6.4"
sha2 = "=0.10.9"
subtle = "=2.6.1"
zeroize = { version = "=1.9.0", features = ["zeroize_derive"] }

[dev-dependencies]
criterion = "=0.5.1"
rand_chacha = "=0.3.1"
router-ab-ecdsa-client-protocol = { path = "../router-ab-ecdsa-client-protocol", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
