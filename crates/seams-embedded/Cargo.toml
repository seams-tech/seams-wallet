[package]
name = "seams-embedded"
version = "0.1.0"
edition = "2021"
publish = false
description = "Embedded Rust SDK facade over signer-core primitives"
license = "Apache-2.0"

[lib]
name = "seams_embedded"
path = "src/lib.rs"

[dependencies]
signer-core = { path = "../signer-core", default-features = false }

[features]
default = []
secp256k1 = ["signer-core/secp256k1"]
near-ed25519-recovery = ["signer-core/near-ed25519-recovery"]
near-threshold-ed25519 = ["signer-core/near-threshold-ed25519"]
near-crypto = ["signer-core/near-crypto"]
tx-finalization = ["signer-core/tx-finalization"]
