[package]
name = "signer-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared signer core primitives"
license = "Apache-2.0"

[lib]
name = "signer_core"
path = "src/lib.rs"

[dependencies]
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = { version = "=1.0.151", optional = true }
ts-rs = { version = "=12.0.1", optional = true }
hkdf = { version = "=0.12.4", optional = true }
borsh = { version = "=1.6.1", features = ["derive"], optional = true }
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "schnorr", "arithmetic"], optional = true }
p256 = { version = "=0.13.2", default-features = false, features = ["arithmetic"], optional = true }
ciborium = { version = "=0.2.2", optional = true }
sha2 = { version = "=0.10.9", optional = true }
sha3 = { version = "=0.10.9", optional = true }
bs58 = { version = "=0.5.1", optional = true }
base64ct = { version = "=1.8.3", features = ["alloc"], optional = true }
ed25519-dalek = { version = "=2.2.0", default-features = false, optional = true }
chacha20poly1305 = { version = "=0.10.1", optional = true }
router-ab-ecdsa-derivation = { path = "../router-ab-ecdsa-derivation", optional = true }
router-ab-ecdsa-client-protocol = { path = "../router-ab-ecdsa-client-protocol", default-features = false, optional = true }
rand_core = { version = "=0.6.4", features = ["getrandom"], optional = true }
curve25519-dalek = { version = "=4.1.3", features = ["rand_core", "zeroize"], optional = true }
subtle = { version = "=2.6.1", default-features = false, optional = true }
frost-ed25519 = { version = "=2.2.0", default-features = false, features = ["serialization", "std"], optional = true }
zeroize = { version = "=1.9.0", features = ["zeroize_derive"] }

[features]
default = []
secp256k1 = ["dep:hkdf", "dep:k256", "dep:sha2", "dep:sha3"]
passkey-custody = ["dep:hkdf", "dep:sha2", "dep:base64ct", "dep:chacha20poly1305", "dep:serde"]
ed25519-yao-client-root-transfer = [
    "passkey-custody",
    "ed25519-yao-derivation",
    "dep:curve25519-dalek",
    "dep:subtle",
]
tx-finalization = ["dep:serde", "dep:sha3"]
webauthn-p256 = ["dep:ciborium", "dep:p256"]
ecdsa-role-local-client = [
    "dep:hkdf",
    "dep:sha2",
    "dep:base64ct",
    "dep:router-ab-ecdsa-derivation",
    "dep:router-ab-ecdsa-client-protocol",
]
typescript-bindings = ["dep:serde", "dep:serde_json", "dep:ts-rs"]
near-ed25519-recovery = ["dep:hkdf", "dep:sha2", "dep:base64ct", "dep:curve25519-dalek", "dep:serde", "dep:bs58", "dep:rand_core", "dep:ed25519-dalek"]
near-threshold-ed25519 = ["near-ed25519-recovery", "dep:frost-ed25519", "dep:borsh"]
ed25519-yao-derivation = ["dep:hkdf", "dep:sha2", "dep:curve25519-dalek"]

[dev-dependencies]
hex-literal = "=0.4.1"
serde_json = "=1.0.151"
