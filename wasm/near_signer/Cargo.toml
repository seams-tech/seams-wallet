[package]
name = "wasm_signer_worker"
version = "0.4.3"
edition = "2021"
publish = false
description = "Web3Authn Signer worker"
license = "Apache-2.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = true

# Leaner release builds for smaller WASM size
# Maximize size reduction
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Empty workspace to make this package independent
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
bs58 = "0.5"
base64ct = { version = "1.6", features = ["alloc"] }
borsh = { version = "1.3", features = ["derive"] }
getrandom = { version = "0.2.15", features = ["js"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
log = { version = "0.4", features = ["release_max_level_info"] }
zeroize = "1.8"
js-sys = "0.3"
signer-core = { path = "../../crates/signer-core", features = ["near-threshold-ed25519", "passkey-custody", "ed25519-yao-client-root-transfer", "typescript-bindings"] }

[dev-dependencies]
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core"] }

[features]
default = []
