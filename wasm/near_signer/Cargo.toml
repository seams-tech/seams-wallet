[package]
name = "wasm_signer_worker"
version = "0.4.3"
edition = "2021"
publish = false
description = "Web3Authn Signer worker"
license = "Apache-2.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = true

# Leaner release builds for smaller WASM size
# Maximize size reduction
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Empty workspace to make this package independent
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
bs58 = "=0.5.1"
base64ct = { version = "=1.8.3", features = ["alloc"] }
borsh = { version = "=1.6.1", features = ["derive"] }
getrandom = { version = "=0.2.17", features = ["js"] }
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde-wasm-bindgen = "=0.6.5"
wasm-bindgen = "=0.2.100"
log = { version = "=0.4.27", features = ["release_max_level_info"] }
zeroize = "=1.9.0"
js-sys = "=0.3.77"
signer-core = { path = "../../crates/signer-core", features = ["near-threshold-ed25519", "passkey-custody", "ed25519-yao-client-root-transfer", "typescript-bindings"] }

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["rand_core"] }

[features]
default = []
