[package]
name = "oprf_runtime"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "WASM runtime for the RFC 9497 POPRF on ristretto255-SHA512"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
getrandom = { version = "=0.2.17", features = ["js"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
voprf = { version = "=0.5.0", default-features = false, features = ["ristretto255-ciphersuite", "alloc"] }
wasm-bindgen = "=0.2.118"
zeroize = "=1.8.2"
