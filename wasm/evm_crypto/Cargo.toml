[package]
name = "evm_crypto"
version = "0.1.0"
edition = "2021"
publish = false
description = "EVM transaction hashing/encoding + secp256k1 signing (WASM)"
license = "Apache-2.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
getrandom = { version = "0.2.15", features = ["js"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
sha2 = "0.10"
wasm-bindgen = "0.2"
zeroize = "1.8"
signer-core = { path = "../../crates/signer-core", features = ["secp256k1", "tx-finalization", "webauthn-p256"] }
