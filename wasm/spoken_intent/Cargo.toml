[package]
name = "spoken_intent_wasm"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "WASM build of the spoken-intent transcript reader for Wallet core and the Seams co-signer"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# The crate of seams-tech/speak-to-sign `dev`. A new rev is a new reading of transcripts: run the
# Speak-to-Sign unit tests with it before the change lands.
spoken-intent = { git = "https://github.com/seams-tech/speak-to-sign", rev = "bbb76174430d51d28689d54c7dacaa58ebfd053f" }
wasm-bindgen = "=0.2.118"
