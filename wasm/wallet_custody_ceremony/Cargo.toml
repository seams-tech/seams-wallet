[package]
name = "wallet_custody_ceremony"
version = "0.1.0"
edition = "2021"
description = "Browser wallet custody ceremonies: registration and recovery re-establishment"
license = "Apache-2.0"
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
base64ct = { version = "1.6", features = ["alloc"] }
router-ab-core = { path = "../../crates/router-ab-core" }
router-ab-ecdsa-derivation = { path = "../../crates/router-ab-ecdsa-derivation" }
router-ab-ed25519-yao-client = { path = "../../crates/router-ab-ed25519-yao-client", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
signer-core = { path = "../../crates/signer-core", features = [
  "ecdsa-role-local-client",
  "ed25519-yao-derivation",
  "near-threshold-ed25519",
  "passkey-custody",
  "typescript-bindings",
] }
wasm-bindgen = "=0.2.100"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2.17"

[dev-dependencies]
hpke-ng = "0.1.0"
router-ab-dev = { path = "../../crates/router-ab-dev" }
router-ab-ed25519-yao = { path = "../../crates/router-ab-ed25519-yao" }
